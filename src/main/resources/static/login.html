<!DOCTYPE html>
<!-- [NEW FILE - login] Added in the Login update. The login page (open to everyone). -->
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Log in · User Management</title>
    <style>
        :root {
            --bg: #f5f6fa;
            --surface: #ffffff;
            --text: #1f2430;
            --muted: #6b7280;
            --border: #e5e7ee;
            --primary: #4f46e5;
            --primary-dark: #4338ca;
            --danger: #dc2626;
            --success: #157f3b;
            --ease: cubic-bezier(0.22, 1, 0.36, 1);
        }
        * { box-sizing: border-box; }
        [hidden] { display: none !important; }

        body {
            font-family: "Inter", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
            margin: 0;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            background: var(--bg);
            color: var(--text);
            -webkit-font-smoothing: antialiased;
            line-height: 1.5;
        }

        /* Top band: same gradient as the CMS header */
        .band {
            background: linear-gradient(120deg, #1e1b4b 0%, #312e81 55%, #4f46e5 100%);
            height: 220px;
        }

        main {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            padding: 0 16px 48px;
            margin-top: -150px;          /* the card overlaps the band */
        }

        .card {
            width: 100%;
            max-width: 400px;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 32px 28px 28px;
            box-shadow: 0 1px 2px rgba(16, 24, 40, 0.04), 0 18px 48px rgba(30, 27, 75, 0.18);
            animation: cardIn 0.6s var(--ease) both;
        }

        .brand { display: flex; align-items: center; gap: 10px; color: var(--primary); font-weight: 650; font-size: 0.85rem; letter-spacing: 0.02em; }
        .brand::before {
            content: "";
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: var(--primary);
            box-shadow: 0 0 0 4px rgba(79, 70, 229, 0.18);
        }
        h1 { margin: 14px 0 4px; font-size: 1.5rem; font-weight: 700; letter-spacing: -0.02em; }
        .sub { margin: 0 0 22px; color: var(--muted); font-size: 0.92rem; }

        label { display: block; margin: 14px 0 6px; font-weight: 600; font-size: 0.85rem; color: #374151; }
        input {
            width: 100%;
            padding: 11px 12px;
            border: 1px solid #d5d9e3;
            border-radius: 8px;
            font-size: 0.95rem;
            font-family: inherit;
            color: var(--text);
            background: #fff;
            transition: border-color 0.2s, box-shadow 0.2s;
        }
        input:hover { border-color: #b7bdcd; }
        input:focus { outline: none; border-color: var(--primary); box-shadow: 0 0 0 4px rgba(79, 70, 229, 0.15); }

        .password-wrap { position: relative; }
        .password-wrap input { padding-right: 44px; }
        .toggle-password {
            position: absolute;
            right: 4px;
            top: 50%;
            transform: translateY(-50%);
            padding: 6px;
            border: none;
            border-radius: 6px;
            background: transparent;
            color: var(--muted);
            line-height: 0;
            cursor: pointer;
        }
        .toggle-password:hover { background: #eceef4; color: var(--text); }
        .toggle-password:focus-visible { outline: 3px solid rgba(79, 70, 229, 0.4); outline-offset: 2px; }
        .toggle-password svg { width: 18px; height: 18px; }
        .toggle-password .eye-closed { display: none; }
        .toggle-password[aria-pressed="true"] .eye-open { display: none; }
        .toggle-password[aria-pressed="true"] .eye-closed { display: inline; }

        .btn-primary {
            width: 100%;
            margin-top: 24px;
            padding: 11px 16px;
            border: none;
            border-radius: 8px;
            background: var(--primary);
            color: #fff;
            font-size: 0.95rem;
            font-weight: 600;
            font-family: inherit;
            cursor: pointer;
            box-shadow: 0 2px 8px rgba(79, 70, 229, 0.3);
            transition: background 0.2s, box-shadow 0.2s, transform 0.15s var(--ease);
        }
        .btn-primary:hover:not(:disabled) { background: var(--primary-dark); box-shadow: 0 4px 14px rgba(79, 70, 229, 0.4); transform: translateY(-1px); }
        .btn-primary:disabled { opacity: 0.7; cursor: progress; }
        .btn-primary:focus-visible { outline: 3px solid rgba(79, 70, 229, 0.4); outline-offset: 2px; }

        .message { padding: 11px 13px; border-radius: 10px; font-size: 0.88rem; font-weight: 500; margin-bottom: 4px; animation: slideIn 0.35s var(--ease); }
        .message.error { background: #fdeceb; color: #b42318; border: 1px solid #f6c7c4; }
        .message.info { background: #e8f8ee; color: var(--success); border: 1px solid #bfe9cd; }
        .message.warn { background: #fff7e6; color: #92400e; border: 1px solid #fcd9a0; }   /* [ADDED - session fix] */

        .foot { margin-top: 18px; text-align: center; color: var(--muted); font-size: 0.8rem; }

        @keyframes cardIn { from { opacity: 0; transform: translateY(18px); } to { opacity: 1; transform: none; } }
        @keyframes slideIn { from { opacity: 0; transform: translateY(-6px); } to { opacity: 1; transform: none; } }
        @keyframes shake { 0%, 100% { transform: translateX(0); } 25% { transform: translateX(-5px); } 75% { transform: translateX(5px); } }
        .shake { animation: shake 0.35s; }
        @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }
    </style>
</head>
<body>

<div class="band"></div>

<main>
    <form class="card" id="login-form" novalidate>
        <div class="brand">User Management System</div>
        <h1>Welcome back</h1>
        <p class="sub">Log in with your email and password.</p>

        <!-- Messages: errors (wrong password ...) and "you have been logged out" -->
        <div class="message error" id="login-error" role="alert" hidden></div>
        <div class="message info" id="login-info" role="status" hidden></div>

        <label for="email">Email</label>
        <input type="email" id="email" name="email" autocomplete="username" required autofocus>

        <label for="password">Password</label>
        <div class="password-wrap">
            <input type="password" id="password" name="password" autocomplete="current-password" required>
            <button type="button" class="toggle-password" id="toggle-password"
                    aria-label="Show password" aria-pressed="false">
                <svg class="eye-open" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
                <svg class="eye-closed" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94"/><path d="M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19"/><path d="M14.12 14.12a3 3 0 1 1-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/></svg>
            </button>
        </div>

        <button type="submit" class="btn-primary" id="login-btn">Log in</button>
        <p class="foot">No password yet? Ask an administrator to set one for you.</p>
    </form>
</main>

<script src="/js/auth.js"></script>
<script>
    const form = document.getElementById("login-form");
    const emailInput = document.getElementById("email");
    const passwordInput = document.getElementById("password");
    const loginBtn = document.getElementById("login-btn");
    const errorBox = document.getElementById("login-error");
    const infoBox = document.getElementById("login-info");

    // After logout we come here with ?loggedOut in the address
    if (new URLSearchParams(location.search).has("loggedOut")) {
        infoBox.textContent = "You have been logged out.";
        infoBox.hidden = false;
    }

    // [ADDED - session fix] we were sent here because the session ended (timeout or server restart)
    if (new URLSearchParams(location.search).has("expired")) {
        infoBox.textContent = "Your session has ended (for example, the server was restarted). Please log in again.";
        infoBox.className = "message warn";
        infoBox.hidden = false;
    }

    // Already logged in? Then skip this page.
    fetch("/api/me").then(async response => {
        if (!response.ok) return;
        const me = await response.json();
        location.href = (me.roleName === "ADMIN" || me.roleName === "MANAGER") ? "/index.html" : "/account.html";
    });

    function showError(text) {
        infoBox.hidden = true;
        errorBox.textContent = text;
        errorBox.hidden = false;
        form.classList.remove("shake");
        void form.offsetWidth;          // restart the shake animation
        form.classList.add("shake");
    }

    form.addEventListener("submit", async (event) => {
        event.preventDefault();
        errorBox.hidden = true;

        const email = emailInput.value.trim();
        const password = passwordInput.value;
        if (email === "" || password === "") {
            showError("Please enter your email and password.");
            return;
        }

        loginBtn.disabled = true;
        loginBtn.textContent = "Logging in...";
        try {
            // Spring Security reads a normal form body (email=...&password=...), not JSON
            const response = await fetch("/login", {
                method: "POST",
                headers: { "X-XSRF-TOKEN": csrfToken() },
                body: new URLSearchParams({ email, password })
            });
            const data = await response.json().catch(() => ({}));

            if (response.ok) {
                notifyAuthChanged();             // [ADDED - tabs fix] other open tabs reload as the new user
                location.href = data.redirect;   // /index.html or /account.html, chosen by the server
                return;
            }
            showError(data.message || "Login failed (status " + response.status + ")");
            passwordInput.value = "";
            passwordInput.focus();
        } catch (err) {
            showError("Could not reach the server.");
        } finally {
            loginBtn.disabled = false;
            loginBtn.textContent = "Log in";
        }
    });

    // Show / hide the password
    const toggle = document.getElementById("toggle-password");
    toggle.addEventListener("click", () => {
        const show = passwordInput.type === "password";
        passwordInput.type = show ? "text" : "password";
        toggle.setAttribute("aria-pressed", String(show));
        toggle.setAttribute("aria-label", show ? "Hide password" : "Show password");
    });
</script>
</body>
</html>
